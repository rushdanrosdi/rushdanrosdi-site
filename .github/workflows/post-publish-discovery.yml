name: Post-publish discovery

on:
  push:
    branches:
      - main
    paths:
      - 'src/content/**'
  workflow_dispatch:
    inputs:
      url:
        description: 'Optional production URL to run through discovery manually'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: post-publish-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_ORIGIN: https://rushdanrosdi.com
      VALIDATOR_BASE: https://rushdanrosdi-discovery-validator.webdesignseo2u.workers.dev
      ADMIN_TOKEN: ${{ secrets.DISCOVERY_ADMIN_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check discovery secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "Missing GitHub Actions secret: DISCOVERY_ADMIN_TOKEN" >&2
            exit 1
          fi

      - name: Resolve production URLs
        id: urls
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          : > /tmp/discovery-urls.txt

          if [ -n "${MANUAL_URL:-}" ]; then
            printf '%s\n' "$MANUAL_URL" > /tmp/discovery-urls.txt
          else
            ZERO_SHA="0000000000000000000000000000000000000000"
            if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "$ZERO_SHA" ]; then
              changed=$(git diff --name-only --diff-filter=AM "$BEFORE_SHA" "$GITHUB_SHA" -- 'src/content/**' || true)
            else
              changed=$(git show --pretty='' --name-only --diff-filter=AM "$GITHUB_SHA" -- 'src/content/**' || true)
            fi

            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                src/content/*.md|src/content/*.mdx|src/content/*/*.md|src/content/*/*.mdx|src/content/*/*/*.md|src/content/*/*/*.mdx)
                  ;;
                *)
                  continue
                  ;;
              esac

              relative="${file#src/content/}"
              collection="${relative%%/*}"
              filename="${relative##*/}"
              slug="${filename%.md}"
              slug="${slug%.mdx}"
              slug=$(printf '%s' "$slug" | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-//')

              if [ "$collection" = "$relative" ] || [ -z "$slug" ]; then
                echo "Skipping content path with no routable collection: $file"
                continue
              fi

              printf '%s/%s/%s/\n' "${SITE_ORIGIN%/}" "$collection" "$slug" >> /tmp/discovery-urls.txt
            done <<< "$changed"
          fi

          sort -u /tmp/discovery-urls.txt -o /tmp/discovery-urls.txt

          if [ ! -s /tmp/discovery-urls.txt ]; then
            echo "No production content URLs detected; nothing to submit."
            echo "has_urls=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Resolved URLs:"
          cat /tmp/discovery-urls.txt
          echo "has_urls=true" >> "$GITHUB_OUTPUT"

      - name: Wait for production deployment and run discovery
        if: steps.urls.outputs.has_urls == 'true'
        shell: bash
        run: |
          set -euo pipefail
          overall_failure=0

          while IFS= read -r url; do
            [ -z "$url" ] && continue
            echo "Processing: $url"

            encoded=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$url")
            validation_ok=false

            # Cloudflare Pages can finish after the GitHub push. Poll validation only;
            # do not trigger IndexNow/GSC repeatedly while waiting for deployment.
            for attempt in $(seq 1 20); do
              validation=$(curl -sS --max-time 30 "${VALIDATOR_BASE}/?url=${encoded}" || true)
              if [ "$(printf '%s' "$validation" | jq -r '.ok // false' 2>/dev/null)" = "true" ]; then
                validation_ok=true
                echo "Production validation passed on attempt $attempt."
                break
              fi
              echo "Production not ready yet (attempt $attempt/20). Waiting 30s..."
              sleep 30
            done

            if [ "$validation_ok" != "true" ]; then
              echo "::error::Production validation did not pass for $url"
              overall_failure=1
              continue
            fi

            payload=$(jq -nc --arg url "$url" '{url:$url}')
            response=$(curl -sS --max-time 90 \
              -X POST "${VALIDATOR_BASE}/discover" \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${ADMIN_TOKEN}" \
              --data "$payload" || true)

            echo "$response" | jq . || printf '%s\n' "$response"

            validation_pass=$(printf '%s' "$response" | jq -r '.validation.ok // false' 2>/dev/null)
            gsc_pass=$(printf '%s' "$response" | jq -r '.discovery.google.sitemap.submitted // false' 2>/dev/null)
            inspection_pass=$(printf '%s' "$response" | jq -r '.discovery.google.inspection.inspected // false' 2>/dev/null)
            storage_pass=$(printf '%s' "$response" | jq -r '.storage.stored // false' 2>/dev/null)
            indexnow_submitted=$(printf '%s' "$response" | jq -r '.discovery.indexNow.submitted // false' 2>/dev/null)
            indexnow_status=$(printf '%s' "$response" | jq -r '.discovery.indexNow.status // "n/a"' 2>/dev/null)
            google_coverage=$(printf '%s' "$response" | jq -r '.discovery.google.inspection.coverageState // "unknown"' 2>/dev/null)

            {
              echo "### Discovery: $url"
              echo "- Validation: $validation_pass"
              echo "- GSC sitemap submitted: $gsc_pass"
              echo "- Google URL Inspection: $inspection_pass"
              echo "- Google coverage: $google_coverage"
              echo "- D1 stored: $storage_pass"
              echo "- IndexNow submitted: $indexnow_submitted (HTTP $indexnow_status)"
            } >> "$GITHUB_STEP_SUMMARY"

            # IndexNow is best-effort and explicitly non-blocking. A 429 or other
            # IndexNow failure must not stop daily publishing/discovery operations.
            if [ "$indexnow_submitted" != "true" ]; then
              echo "::warning::IndexNow did not accept $url (HTTP $indexnow_status). Continuing because IndexNow is non-blocking."
            fi

            # Core Level 2 success = production validation + Google submission /
            # observability + D1 logging. IndexNow is deliberately excluded.
            if [ "$validation_pass" != "true" ] || \
               [ "$gsc_pass" != "true" ] || \
               [ "$inspection_pass" != "true" ] || \
               [ "$storage_pass" != "true" ]; then
              echo "::error::Core discovery pipeline failed for $url"
              overall_failure=1
            else
              echo "Core Level 2 discovery completed for $url"
            fi
          done < /tmp/discovery-urls.txt

          exit "$overall_failure"
